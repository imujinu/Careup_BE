
server:
  port: 8081

eureka:
  client:
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: branch-service
  config:
    activate:
      on-profile: local
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/careup
    username: root
    password: 1234
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 1000MB
      max-request-size: 1000MB
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-topic-group-01

cloud:
  aws:
    credentials:
      access-key: ${ACCESS_KEY}
      secret-key: ${SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${S3_BUCKET}

jwt:
  accessTokenExpiryMinutes: 30 # 30분
  secretKeyAt: ${ACCESS_TOKEN}
  #  refreshTokenExpiryDays: 180 # 180일
  refreshTokenExpiryDaysPersistent: 180 # 180일 (자동 로그인 O)
  refreshTokenExpiryDaysNonPersistent: 1 # 1일 (자동 로그인 X)
  secretKeyRt: ${REFRESH_TOKEN}

security:
  csrf:
    allowed-origins:
      - "http://localhost:3000"
    skip-paths:
      - "/health"

logging:
  level:
    root: info

