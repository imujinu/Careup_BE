apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careup-ingress
  namespace: care-up
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://www.careup.store"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept, Origin"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "server.careup.store"
      secretName: server-careup-store-tls
  rules:
    - host: server.careup.store
      http:
        paths:
          - path: /ordering-service(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ordering-service
                port:
                  number: 80

          - path: /branch-service(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: branch-service
                port:
                  number: 80
