name: CI/CD Pipeline for CareUp MSA

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  K8S_NAMESPACE: careup

jobs:
  # ==================== 변경 사항 감지 ====================
  detect-changes:
    name: Detect Service Changes
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.changes.outputs.branch }}
      ordering: ${{ steps.changes.outputs.ordering }}
      k8s: ${{ steps.changes.outputs.k8s }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            branch:
              - 'branch/**'
            ordering:
              - 'ordering/**'
            k8s:
              - 'k8s/**'

  # ==================== Branch Service 빌드 및 배포 ====================
  build-deploy-branch:
    name: Build & Deploy Branch Service
    needs: detect-changes
    if: needs.detect-changes.outputs.branch == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./branch/gradlew

      - name: Build with Gradle
        run: |
          cd branch
          ./gradlew clean build -x test

      - name: Run tests
        run: |
          cd branch
          ./gradlew test
        continue-on-error: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/careup-branch
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./branch
          file: ./branch/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/careup-branch:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/careup-branch:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Kubernetes
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/branch-deployment branch=${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/careup-branch:${{ env.IMAGE_TAG }} -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/branch-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=5m

  # ==================== Ordering Service 빌드 및 배포 ====================
  build-deploy-ordering:
    name: Build & Deploy Ordering Service
    needs: detect-changes
    if: needs.detect-changes.outputs.ordering == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./ordering/gradlew

      - name: Build with Gradle
        run: |
          cd ordering
          ./gradlew clean build -x test

      - name: Run tests
        run: |
          cd ordering
          ./gradlew test
        continue-on-error: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/careup-ordering
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ordering
          file: ./ordering/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/careup-ordering:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/careup-ordering:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Kubernetes
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/ordering-deployment ordering=${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/careup-ordering:${{ env.IMAGE_TAG }} -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/ordering-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=5m

  # ==================== 배포 알림 ====================
  notify:
    name: Deployment Notification
    needs: [build-deploy-branch, build-deploy-ordering]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment status
        run: |
          echo "🚀 Deployment Status Report"
          echo "=========================="
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Branch Service: ${{ needs.build-deploy-branch.result }}"
          echo "Ordering Service: ${{ needs.build-deploy-ordering.result }}"

        continue-on-error: true

