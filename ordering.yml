apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering
  namespace: care-up
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ordering
  template:
    metadata:
      labels:
        app: ordering
    spec:
      containers:
        - name: ordering
          image: 565393060633.dkr.ecr.ap-northeast-2.amazonaws.com/careup/ordering:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: DB_HOST
            - name: DB_PORT
              value: "3306"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: DB_PW
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: AWS_REGION
              value: ap-northeast-2
            - name: ACCESS_TOKEN_CUSTOMER
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key : ACCESS_TOKEN_CUSTOMER
            - name: REFRESH_TOKEN_CUSTOMER
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key : REFRESH_TOKEN_CUSTOMER
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ordering-service
  namespace: care-up
spec:
  selector:
    app: ordering
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP