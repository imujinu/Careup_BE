apiVersion: apps/v1
kind: Deployment
metadata:
  name: branch-deployment
  namespace: care-up
spec:
  replicas: 2
  selector:
    matchLabels:
      app: branch-service
  template:
    metadata:
      labels:
        app: branch-service
    spec:
      containers:
        - name: branch-service
          image: 565393060633.dkr.ecr.ap-northeast-2.amazonaws.com/careup/branch:latest
          ports:
            - containerPort: 8081
          resources:
            limits:
              cpu: "1"
              memory: "600Mi"
            requests:
              cpu: "0.5"
              memory: "300Mi"
          env:
            # ===== DB =====
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: DB_HOST
            - name: DB_PW
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: DB_PW

            # ===== MAIL =====
            - name: MAIL_USER
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: MAIL_USER
            - name: MAIL_PW
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: MAIL_PW

            # ===== AWS S3 =====
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: ACCESS_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: SECRET_KEY
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: S3_BUCKET

            # ===== JWT =====
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: ACCESS_TOKEN
            - name: REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: REFRESH_TOKEN

            # ===== OpenAI =====
            - name: OpenAi-Api-Key
              valueFrom:
                secretKeyRef:
                  name: careup-secrets
                  key: OpenAi-Api-Key

            # ===== 컨테이너 메타 정보 =====
            - name: CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: branch-service
  namespace: care-up
spec:
  type: ClusterIP
  ports:
    - port: 80         # Ingress가 접근할 포트
      targetPort: 8081 # 실제 파드(Spring Boot 포트)
  selector:
    app: branch-service
