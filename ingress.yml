apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careup-ingress
  namespace: care-up
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://www.careup.store"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept, Origin"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "server.careup.store"
      secretName: server-careup-store-tls
  rules:
    - host: server.careup.store
      http:
        paths:
          - path: /ordering-service
            pathType: Prefix
            backend:
              service:
                name: ordering-service
                port:
                  number: 80
          - path: /branch-service
            pathType: Prefix
            backend:
              service:
                name: branch-service
                port:
                  number: 80
