apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: care-up
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium-connect
  template:
    metadata:
      labels:
        app: debezium-connect
    spec:
      containers:
        - name: debezium-connect
          image: quay.io/debezium/connect:2.7
          ports:
            - containerPort: 8083
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"       # ✅ Kafka 주소 수정
            - name: CONNECT_GROUP_ID
              value: "connect-cluster"

            # 필수 상태 토픽
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: "connect-configs"
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: "connect-offsets"
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: "connect-status"

            # JSON 변환 설정
            - name: CONNECT_KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"

            # 내부 변환기
            - name: CONNECT_INTERNAL_KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_INTERNAL_VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"

            - name: CONNECT_PLUGIN_PATH
              value: "/kafka/connect"

            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: connector-config
              mountPath: /kafka/connectors/mysql-connector-careup.json
              subPath: mysql-connector-careup.json
          command:
            - /bin/bash
            - -c
            - |
              /docker-entrypoint.sh start &

              echo "⏳ Waiting for Debezium Connect REST API..."
              until curl -sf http://localhost:8083/connectors; do
                echo "Still waiting..."
                sleep 30
              done

              echo "✅ REST API ready, registering MySQL connector..."
              curl -X POST -H 'Content-Type: application/json' \
                   --data @/kafka/connectors/mysql-connector-careup.json \
                   http://localhost:8083/connectors || echo "Connector may already exist"

              wait
      volumes:
        - name: connector-config
          configMap:
            name: mysql-connector-config
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  namespace: care-up
spec:
  selector:
    app: debezium-connect
  ports:
    - name: rest
      port: 8083
      targetPort: 8083
  type: ClusterIP
