server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - 'http://localhost:5173'
              - 'http://localhost:3000'
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      routes:
        - id: ordering-service-prefixed
          predicates:
            - Path=/ordering-service/**
          filters:
            - StripPrefix=1
          uri: lb://ordering-service

        - id: branch-service-prefixed
          predicates:
            - Path=/branch-service/**
          filters:
            - StripPrefix=1
          uri: lb://branch-service

        # 쇼핑몰 공개 인증
        - id: ordering-public-auth-shortcut
          predicates:
            - Path=/public/auth/customers/**
          uri: lb://ordering-service

        # 직원 공개 인증
        - id: branch-public-auth-shortcut
          predicates:
            - Path=/public/auth/employees/**
          uri: lb://branch-service

        # 고객 인증
        - id: ordering-auth-shortcut
          predicates:
            - Path=/auth/customers/**
          uri: lb://ordering-service

        # 공개 상품/카테고리/재고
        - id: ordering-public-apis
          predicates:
            - Path=/api/**, /inventory/**
          uri: lb://ordering-service

        # 직원 인증(/auth/**) — customers보다 뒤
        - id: branch-auth-shortcut
          predicates:
            - Path=/auth/**
          uri: lb://branch-service

        # 고객 마이페이지/탈퇴
        - id: ordering-customers-shortcut
          predicates:
            - Path=/customers/**
          uri: lb://ordering-service

        # 발주(구매요청)
        - id: branch-purchase-orders
          predicates:
            - Path=/purchase-orders/**
          uri: lb://branch-service

        # 직원(단·복수 경로 모두 지원)
        - id: branch-employees-shortcut
          predicates:
            - Path=/employee/**, /employees/**
          uri: lb://branch-service

    discovery:
      enabled: true

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
