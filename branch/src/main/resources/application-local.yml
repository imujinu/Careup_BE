server:
  port: 8081

eureka:
  client:
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: branch-service
  config:
    activate:
      on-profile: local
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/careup
    username: root
    password: 1234
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 1000MB
      max-request-size: 1000MB
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-topic-group-01
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PW}
    from: careup.noreply@gmail.com
    from.name: Care-Up            # 직원 From 표시명
    default-encoding: UTF-8
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            trust: smtp.gmail.com
  main:
    allow-bean-definition-overriding: true

cloud:
  aws:
    credentials:
      access-key: ${ACCESS_KEY}
      secret-key: ${SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${S3_BUCKET}

jwt:
  accessTokenExpiryMinutes: 30   # 테스트용
  refreshTokenExpiryDaysPersistent: 180
  refreshTokenExpiryDaysNonPersistent: 1
  secretKeyAt: ${ACCESS_TOKEN}
  secretKeyRt: ${REFRESH_TOKEN}

security:
  csrf:
    allowed-origins:
      - "http://localhost:5173"
    skip-paths:
      - "/health"

attendance:
  geofence:
    enabled: true
    radiusSlackMeters: 30
    maxAccuracyMeters: 100

careup:
  mail:
    support-email: support@careup.com
    reset-base-url: "http://localhost:5173/password/reset"  # 직원 FE 경로

# 브랜드(직원) — Care-Up (보라 버튼)
brand:
  name: Care-Up
  logo-url: ""   # 필요 시 CDN 경로
  slogan: "Where Management Meets Care"
  cta-color: "#7C3AED"   # 보라 버튼

logging:
  level:
    root: info
