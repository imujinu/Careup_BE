plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.careup'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}
ext {
	springAiVersion = '1.0.0-M6'
}
configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 1. Querydsl 라이브러리
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'

	// 2. Q-Class를 생성하기 위한 APT 설정
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"


    // jwt 및 security
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    //aws s3
    implementation 'software.amazon.awssdk:s3:2.17.58'

    //spring mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    //redis 의존성
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    //kafka
    implementation 'org.springframework.kafka:spring-kafka:2.9.0'

    //websocket 의존성
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

	//    eureka client의존성 추가
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	// ✅ JSON Simple 라이브러리 추가 (토스페이먼츠 API용)
	implementation 'com.googlecode.json-simple:json-simple:1.1.1'

	// redis 의존성 추가
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// redisson 분산 락 의존성 추가
	implementation 'org.redisson:redisson-spring-boot-starter:3.24.3'

	// kafka 의존성 추가
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.apache.kafka:kafka-streams'
	// Spring Cloud OpenFeign 의존성 추가
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

	// Elasticsearch 의존성 추가
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // OAuth2 Client 의존성 추가
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// Apache POI (엑셀 처리)
	implementation 'org.apache.poi:poi:5.2.5'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'

	//qdrant
	implementation 'org.springframework.ai:spring-ai-qdrant-store:1.0.0-M6'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// Spring AI
//	implementation("org.springframework.ai:spring-ai-openai-spring-boot-starter")
	//load balancer
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
}
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
	main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
	options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean {
	delete file(querydslDir)
}

dependencyManagement{
	imports{
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
