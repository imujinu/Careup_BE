apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: care-up
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium-connect
  template:
    metadata:
      labels:
        app: debezium-connect
    spec:
      containers:
        - name: debezium-connect
          image: debezium/connect:2.6
          ports:
            - containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: GROUP_ID
              value: "connect-cluster"
            - name: CONFIG_STORAGE_TOPIC
              value: "connect-configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "connect-offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "connect-status"
            - name: KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: PLUGIN_PATH
              value: "/kafka/connect"
          volumeMounts:
            - name: connector-config
              mountPath: /kafka/connectors/mysql-connector.json
              subPath: mysql-connector.json
          command:
            - /bin/bash
            - -c
            - |
              /docker-entrypoint.sh start &

              echo "⏳ Waiting 60s for Debezium Connect to initialize..."
              sleep 60

              echo "✅ Registering MySQL connector..."
              curl -X POST -H 'Content-Type: application/json' \
                   --data @/kafka/connectors/mysql-connector.json \
                   http://localhost:8083/connectors || echo "Connector may already exist"

              wait
      volumes:
        - name: connector-config
          configMap:
            name: mysql-connector-config
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  namespace: care-up
spec:
  selector:
    app: debezium-connect
  ports:
    - name: rest
      port: 8083
      targetPort: 8083
  type: ClusterIP
