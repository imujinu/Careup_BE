name: CI/CD Pipeline for CareUp MSA

on:
  push:
    branches:
      - develop
      - main

jobs:
  # ==================== 변경 사항 감지 ====================
  detect-changes:
    name: Detect Service Changes
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.changes.outputs.branch }}
      ordering: ${{ steps.changes.outputs.ordering }}
      k8s: ${{ steps.changes.outputs.k8s }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            branch:
              - 'branch/**'
            ordering:
              - 'ordering/**'
  # ==================== Branch Service 빌드 및 배포 ====================
  build-and-deploy:
    name: Build & Deploy Branch Service
    needs: detect-changes
    if: needs.detect-changes.outputs.branch == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: checkout github
        uses: actions/checkout@v2

      - name: install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.33"
        id: install

      - name: configure aws
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key:  ${{ secrets.AWS_SECRET }}
          aws-region: ap-northeast-2

      - name: update cluster information
        run: aws eks update-kubeconfig --name 02-careUp-cluster --region ap-northeast-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: build and push docker image to ecr
        env:
          REGISTRY: 565393060633.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: careup/branch
          IMAGE_TAG: latest
        run: |
          docker build \
          -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          -f ./Dockerfile .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: eks kubectl apply
        run: |
          kubectl rollout restart deployment careup-deployment -n care-up
        # kubectl apply -f ./2.ordersystem/k8s/k8s-ordersystem/depl_svc.yml

  # ==================== Ordering Service 빌드 및 배포 ====================
  build-deploy-ordering-service:
    name: Build & Deploy Ordering Service
    runs-on: ubuntu-latest

    steps:
      - name: checkout github
        uses: actions/checkout@v2

      - name: install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.33"
        id: install

      - name: configure aws
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key:  ${{ secrets.AWS_SECRET }}
          aws-region: ap-northeast-2

      - name: update cluster information
        run: aws eks update-kubeconfig --name 02-careUp-cluster --region ap-northeast-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: build and push docker image to ecr
        env:
          REGISTRY: 565393060633.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: careup/ordering
          IMAGE_TAG: latest
        run: |
          docker build \
          -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          -f ./Dockerfile .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: eks kubectl apply
        run: |
          kubectl rollout restart deployment careup-deployment -n care-up
        # kubectl apply -f ./2.ordersystem/k8s/k8s-ordersystem/depl_svc.yml
        
