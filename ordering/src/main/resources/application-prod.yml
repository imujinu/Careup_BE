  server:
    port: 8080
  eureka:
    client:
      enabled: false
  feign:
    branch-service:
      url: https://server.careup.store/branch-service
  spring:
    application:
      name: ordering-service
    redis:
      redisson:
        file: classpath:redisson.yaml
      host: redis-service
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
    datasource:
      driver-class-name: org.mariadb.jdbc.Driver
      url: jdbc:mariadb://${DB_HOST}:3306/careup
      username: admin
      password: ${DB_PW}
    jpa:
      database: mysql
      database-platform: org.hibernate.dialect.MariaDBDialect
      generate-ddl: true
      hibernate:
        ddl-auto: update
      show_sql: true
    servlet:
      multipart:
        enabled: true
        max-file-size: 1000MB
        max-request-size: 1000MB
    kafka:
      enabled: true
      bootstrap-servers: kafka-service:9092
      consumer:
        group-id: ordering-group
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        properties:
          spring.json.trusted.packages: "com.careup.ordering,com.careup.branch"
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      streams:
        application-id: ordering-service     # Streams 애플리케이션 ID
        bootstrap-servers: kafka-service:9092    # Kafka Streams용 bootstrap servers
        replication-factor: 1
        state-dir: /tmp/kafka-streams
        properties:
          auto.offset.reset: earliest
          default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
          default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
    elasticsearch:
      uris: elasticsearch-service:9200
    ai:
      openai:
        embedding:
          options:
            model: text-embedding-3-small

    mail:
      host: smtp.gmail.com
      port: 587
      username: ${MAIL_USER}
      password: ${MAIL_PW}
      from: careup.noreply@gmail.com
      from.name: SHARK                # 고객 From 표시명
      default-encoding: UTF-8
      properties:
        mail:
          debug: true
          smtp:
            auth: true
            starttls:
              enable: true
              required: true
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000
            ssl:
              trust: smtp.gmail.com

    main:
      allow-bean-definition-overriding: true

  cloud:
    aws:
      credentials:
        access-key: ${ACCESS_KEY}
        secret-key: ${SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${S3_BUCKET}

  # ========== 토스 결제 설정 ==========
  payment:
    toss:
      client-key: test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq
      secret-key: test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6
      security-key: 9e164b0107777969ccefd888fe6f416b949c04bd051c9a07ff69f6ab38fe680c
      api-url: https://api.tosspayments.com

  jwt:
    accessTokenExpiryMinutes: 30
    refreshTokenExpiryDaysPersistent: 180
    refreshTokenExpiryDaysNonPersistent: 1
    secretKeyAt: ${ACCESS_TOKEN_CUSTOMER}
    secretKeyRt: ${REFRESH_TOKEN_CUSTOMER}

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: https://www.careup.store/oauth/google/callback
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      admin-key: ${KAKAO_ADMIN_KEY}
      redirect-uri: https://www.careup.store/oauth/kakao/callback

  security:
    cors:
      allowed-origins:
      - "http://localhost:5173"
      - "https://www.careup.store"
    csrf:
      allowed-origins:
        - "http://localhost:5173"
        - "https://www.careup.store"
      skip-paths:
        - "/health"

  careup:
    mail:
      support-email: support@careup.com
      customer:
        reset-base-url: "https://www.careup.store/customer/password/reset"  # 고객 FE 경로
    branch:
      introspection:
        base-url: https://server.careup.store/branch-service

  # 상품 이미지 설정
  app:
    product-image-base-url: "https://careup-products.s3.ap-northeast-2.amazonaws.com/products"
    default-product-image: "https://careup-products.s3.ap-northeast-2.amazonaws.com/products/default.jpg"

  # 브랜드(고객) — SHARK (EmailSender가 brand.* 참조)
  brand:
    name: SHARK
    logo-url: ""   # 필요 시 CDN 경로
    slogan: "KICKS RULE EVERYTHING AROUND ME"
    cta-color: "#111827"   # 검정 버튼

  # Qdrant 설정
  qdrant:
    host: qdrant-service
    port: 6333

  # 상품 동기화 설정
  product:
    sync:
      scheduler:
        enabled: true  # 스케줄러 활성화 여부 (false로 설정하면 수동 동기화만 가능)
        cron: "0 0 3 * * *"  # 매일 새벽 3시 실행 (초 분 시 일 월 요일)
      initial:
        enabled: false  # 애플리케이션 시작 시 초기 동기화 실행 (배포 시에만 true로 설정 권장)

  logging:
    level:
      root: info
      org.elasticsearch.client: TRACE
      com.careup.ordering.domain.product.elastic: DEBUG
      org.springframework.data.elasticsearch: DEBUG
      org.springframework.kafka: DEBUG
