server:
  port: 0

eureka:
  client:
    enabled: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    # 레지스트리 정보를 빠르게 가져오기
    registry-fetch-interval-seconds: 5  # 5초마다 레지스트리 갱신 (기본: 30초)
    initial-instance-info-replication-interval-seconds: 5  # 최초 등록 5초 후 (기본: 40초)
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${server.port}}
    # 하트비트를 빠르게 전송하여 빠른 등록
    lease-renewal-interval-in-seconds: 5  # 5초마다 하트비트 전송 (기본: 30초)
    lease-expiration-duration-in-seconds: 10  # 10초 동안 하트비트 없으면 제거 (기본: 90초)
feign:
  ordering-service:
    url: http://localhost:8080/ordering-service
spring:
  application:
    name: branch-service
  config:
    activate:
      on-profile: local
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/careup
    username: root
    password: 1234
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 1000MB
      max-request-size: 1000MB
  kafka:
    bootstrap-servers: localhost:9093
    streams:
      application-id: branch-service     # Streams 애플리케이션 ID
      replication-factor: 1
      state-dir: /tmp/kafka-streams
    consumer:
      group-id: test-topic-group-01
      auto-offset-reset: earliest

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PW}
    from: careup.noreply@gmail.com
    from.name: Care-Up            # 직원 From 표시명
    default-encoding: UTF-8
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            trust: smtp.gmail.com
  main:
    allow-bean-definition-overriding: true

  ai:
    openai:
      api-key: ${OpenAi-Api-Key}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
qdrant:
  host: localhost
  rest-port: 6333
  grpc-port: 6334


cloud:
  aws:
    credentials:
      access-key: ${ACCESS_KEY}
      secret-key: ${SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${S3_BUCKET}

jwt:
  accessTokenExpiryMinutes: 3000 # 30분
  secretKeyAt: ${ACCESS_TOKEN}
  #  refreshTokenExpiryDays: 180 # 180일
  refreshTokenExpiryDaysPersistent: 180 # 180일 (자동 로그인 O)
  refreshTokenExpiryDaysNonPersistent: 1 # 1일 (자동 로그인 X)
  secretKeyRt: ${REFRESH_TOKEN}

security:
  csrf:
    allowed-origins:
      - "http://localhost:5173"
    skip-paths:
      - "/health"

attendance:
  window:
    enforce: true
    early-minutes: 60
    late-minutes: 120
    overtime-grace-minutes: 30

careup:
  mail:
    support-email: support@careup.com
    reset-base-url: "http://localhost:5173/password/reset"  # 직원 FE 경로

# 브랜드(직원) — Care-Up (보라 버튼)
brand:
  name: Care-Up
  logo-url: ""   # 필요 시 CDN 경로
  slogan: "Where Management Meets Care"
  cta-color: "#7C3AED"   # 보라 버튼

logging:
  level:
    root: info
