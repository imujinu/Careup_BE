server:
  port: 8080

eureka:
  client:
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: ordering-service
  config:
    activate:
      on-profile: local
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/careup
    username: root
    password: 1234
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 1000MB
      max-request-size: 1000MB

  
  # Kafka 설정 - 비활성화
  kafka:
    enabled: false  # ✅ Kafka 비활성화
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ordering-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.careup.ordering,com.careup.branch"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

cloud:
  aws:
    credentials:
      access-key: xxxxxxxxxxxxx
      secret-key: yyyyyyyyyyyyyy
    region:
      static: ap-northeast-2
    s3:
      bucket: xxxxxxxxxxxxx

