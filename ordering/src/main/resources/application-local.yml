server:
  port: 0
feign:
  branch-service:
    url: http://localhost:8080/branch-service
eureka:
  client:
    enabled: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    # 레지스트리 정보를 빠르게 가져오기
    registry-fetch-interval-seconds: 5  # 5초마다 레지스트리 갱신 (기본: 30초)
    initial-instance-info-replication-interval-seconds: 5  # 최초 등록 5초 후 (기본: 40초)
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${server.port}}
    # 하트비트를 빠르게 전송하여 빠른 등록
    lease-renewal-interval-in-seconds: 5  # 5초마다 하트비트 전송 (기본: 30초)
    lease-expiration-duration-in-seconds: 10  # 10초 동안 하트비트 없으면 제거 (기본: 90초)

spring:
  application:
    name: ordering-service
  config:
    activate:
      on-profile: local
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/careup
    username: root
    password: 1234
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 1000MB
      max-request-size: 1000MB
  kafka:
    enabled: true
    bootstrap-servers: localhost:9093
    consumer:
      group-id: ordering-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.careup.ordering,com.careup.branch"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    streams:
      application-id: ordering-service     # Streams 애플리케이션 ID
      bootstrap-servers: localhost:9093    # Kafka Streams용 bootstrap servers
      replication-factor: 1
      state-dir: /tmp/kafka-streams
      properties:
        auto.offset.reset: earliest
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
  elasticsearch:
    uris: http://localhost:9200
  ai:
    openai:
      embedding:
        options:
          model: text-embedding-3-small

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PW}
    from: careup.noreply@gmail.com
    from.name: SHARK                # 고객 From 표시명
    default-encoding: UTF-8
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            trust: smtp.gmail.com

  main:
    allow-bean-definition-overriding: true

cloud:
  aws:
    credentials:
      access-key: ${ACCESS_KEY}
      secret-key: ${SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${S3_BUCKET}

